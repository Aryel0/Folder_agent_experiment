[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-world"
version = "0.1.0"
description = "A secure, hardened Docker sandbox and simulated world exploration engine for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FolderAgent Team" }
]
keywords = ["sandbox", "docker", "ai-agents", "security", "simulation", "eval"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
sandbox-world = "sandbox_world.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sandbox_world*"]
